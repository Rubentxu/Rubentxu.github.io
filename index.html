                    </fieldset>
                    <fieldset class="style-row" data-panel-section="textAlign">
                        <legend id="style-text-align-legend">Text align</legend>
                        <div id="text-align-row" role="group" aria-labelledby="style-text-align-legend"></div>
                    </fieldset>
                    <fieldset class="style-row" data-panel-section="verticalAlign">
                        <legend id="style-vertical-align-legend">Vertical align</legend>
                        <div id="text-vertical-row" role="group" aria-labelledby="style-vertical-align-legend"></div>
                    </fieldset>
                    <fieldset class="style-row" data-panel-section="arrowheads">
                        <legend id="style-arrowheads-legend">Arrowheads</legend>
                        <div id="arrow-heads-row" role="group" aria-labelledby="style-arrowheads-legend"></div>
                    </fieldset>
                    <fieldset class="style-row" data-panel-section="opacity">
                        <legend id="style-opacity-legend">Opacity</legend>
                        <div id="opacity-row" role="group" aria-label="Opacity">
                            <label for="opacity" class="visually-hidden">Opacity</label>
                            <input id="opacity" type="range" min="0" max="100" step="10" value="100" />
                            <output id="opacity-value" for="opacity">100</output>
                        </div>
                    </fieldset>
                    <fieldset class="style-row" data-panel-section="layers">
                        <legend id="style-layers-legend">Layers</legend>
                        <div id="layers-row" class="buttonList" role="group" aria-labelledby="style-layers-legend"></div>
                    </fieldset>
                    <fieldset class="style-row" data-panel-section="align">
                        <legend id="style-align-legend">Align</legend>
                        <div id="align-row" class="buttonList" role="group" aria-labelledby="style-align-legend"></div>
                    </fieldset>
                    <fieldset class="style-row" data-panel-section="actions">
                        <legend id="style-actions-legend">Actions</legend>
                        <div id="actions-row" class="buttonList" role="group" aria-labelledby="style-actions-legend"></div>
                    </fieldset>
                </div>
            </section>
        </div>
        <div id="top-right">
            <!-- The two buttons upstream keeps in the top-right corner, in its
                 order (`LayerUI.tsx`: `renderTopRightUI` then the library
                 trigger). The share trigger is the primary button, as
                 upstream's is; the library one is an icon island. -->
            <button type="button" data-share aria-label="Share" title="Share a link to this editor">Share</button>
            <button type="button" data-library-trigger aria-label="Library" title="Library"></button>
        </div>
    </div>
    <!-- The canvas footer is upstream's `Footer.tsx`: the zoom group and the
         undo/redo group are two islands side by side in the bottom-left
         corner, and the help button is the `?` in the bottom-right one. The
         icons are not written here: `client/footer.mjs` puts the iconary's
         drawings into the empty buttons, because a hand-copied SVG would be a
         second copy of a drawing the generator owns. The history buttons have
         no words for the same reason upstream's do not: their name is the
         `aria-label`, and the drawing is what the eye reads. -->
    <footer id="canvas-footer" aria-label="Canvas footer">
        <div id="footer-left">
            <div id="zoom-buttons" role="group" aria-label="Zoom">
                <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (Ctrl+-)"></button>
                <button type="button" data-zoom="reset" aria-label="Reset zoom" title="Reset the zoom to 100%">100%</button>
                <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (Ctrl+=)"></button>
            </div>
            <div id="history-buttons" role="group" aria-label="History">
                <button type="button" data-history="undo" aria-label="Undo" title="Undo (Cmd+Z)"></button>
                <button type="button" data-history="redo" aria-label="Redo" title="Redo (Cmd+Shift+Z)"></button>
            </div>
        </div>
        <div id="footer-right">
            <!-- The hint upstream hangs above the help button, pointing at it. -->
            <div id="welcome-screen-help-hint" data-visible="false"></div>
            <button type="button" data-help aria-label="Keyboard shortcuts and help" title="Keyboard shortcuts and help — ?"></button>
        </div>
    </footer>

    <!-- The install offer. Chromium fires `beforeinstallprompt` when the
         application meets the criteria to be installed, and `client/install-
         wiring.mjs` keeps that offer: this button is the way to take it, and
         it stays hidden until the browser says there is something to offer.
         An application that is already installed, and a browser that cannot
         install it, are offered nothing.

         It is not a row of the canvas menu, and not a button of the footer
         either: the menu is the reference's list, row for row, and the pinned
         comparison asserts its rows exactly (`scripts/e2e/context-menu.test.mjs`),
         while the footer is the reference's bottom row down to the pixel
         (`scripts/e2e/canvas-footer.test.mjs`). The offer is a door into the
         browser's own installation, so it lives in a band of its own, at the
         bottom centre, where the reference draws nothing. -->
    <div id="install-offer">
        <button type="button" data-install-app aria-label="Install NextDraw as an application" title="Install NextDraw as an application to open it in a window of its own" hidden>Install app</button>
    </div>

    <div id="status" role="status"></div>
    <dialog id="clear-canvas-dialog" class="sheet"></dialog>
    <dialog id="tab-conflict-dialog" class="sheet"></dialog>
    <!-- The text-edit layer is a transparent overlay sized to the canvas
         that hosts the inline `<textarea>` of H5.11. `pointer-events:
         none` is the default so the layer does not eat the clicks it
         does not want; the editor itself re-enables them on its own
         element. -->
    <div id="text-edit-layer" aria-hidden="true"></div>
    <script type="module" src="./client/index.js"></script>
</body>
</html>
