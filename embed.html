    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NextDraw — embedded</title>
    <link rel="stylesheet" href="./client/fonts/fonts.css">
    <style>
        /* The host's own chrome: the editor mounts in a box the host sizes,
           and the box is the host's business, not the editor's. */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1a1a1a;
            background: #fafafa;
        }
        header {
            padding: 12px 16px;
            font-size: 14px;
        }
        #mount {
            position: relative;
            width: min(960px, 100vw - 32px);
            height: 560px;
            margin: 0 16px 16px;
            border: 1px solid #ececec;
            border-radius: 8px;
            overflow: hidden;
        }
        /* The editor's paper fills the viewport where the demo page mounts it;
           inside this box it fills the box. The host names the box, so the
           host's selector wins on specificity and the editor's own rule never
           has to know a box exists. */
        #mount #paper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        NextDraw, mounted by <code>createNextDrawApp</code> into a box this page owns.
        The markup inside the box is the demo page's own body, fetched and mounted —
        one template, two consumers.
    </header>
    <div id="mount"></div>
    <script type="module" src="./client/embed-page.mjs"></script>
</body>
</html>
